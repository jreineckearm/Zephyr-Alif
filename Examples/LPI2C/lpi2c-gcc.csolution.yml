# A solution is a collection of related projects that share same base configuration.
solution:
  created-for: CMSIS-Toolbox@2.15.0

  packs:
    - pack: AlifSemiconductor::Ensemble@^2.0.0-0

  # List different hardware targets that are used to deploy the solution.
  target-types:
    - type: DevKit-E7
      board: Alif Semiconductor::DevKit-E7
      device: Alif Semiconductor::AE722F80F55D5LS
      variables:
        - west-board: alif_e7_dk/ae722f80f55d5xx/rtss
      target-set:
        - set:
          debugger:
            name: CMSIS-DAP@pyOCD
            port: 3333
            protocol: swd
            clock: 10000000
            start-pname: M55_HE
          images:
            - project-context: LPI2C.Debug
        - set: J-Link_Debug
          images:
            - project-context: LPI2C.Debug
          debugger:
            name: J-Link Server
            port: 3333
            protocol: swd
            clock: 4000000
        - set: ULINKplus_ETR-Trace
          images:
            - project-context: LPI2C.Debug
          debugger:
            name: ULINKplus@pyOCD
            protocol: swd
            clock: 10000000
            device-settings:
              FUNNEL_0_INPUT_MASK: 0x6
              ETR_0_BUFFER_ADDRESS: 0x58000000
              ETR_0_BUFFER_ADDRESS_HI: 0x00000000
              ETR_0_AXI_CTL: 0x00000000
              ETR_0_BUFFER_SIZE: 0x00004000 # 16*4 = 64 KBytes
              #ETR_0_BUFFER_SIZE: 0x00040000 # 256*4 = 1024 KBytes
              #ETR_0_BUFFER_SIZE: 0x00020000 # 128*4 = 512 KBytes
              #ETR_0_BUFFER_SIZE: 0x00010000 # 64*4 = 256 KBytes
              #ETR_0_BUFFER_SIZE: 0x00008000 # 32*4 = 128 KBytes
              #ETR_0_BUFFER_SIZE: 0x00004000 # 16*4 = 64 KBytes
              #ETR_0_BUFFER_SIZE: 0x00002000 # 8*4 KBytes
            trace:
              - trace-buffer:
                mode: file

    - type: DevKit-E8
      board: Alif Semiconductor::DevKit-E8
      device: Alif Semiconductor::AE822FA0E5597LS0
      variables:
        - west-board: alif_e8_dk/ae822fa0e5597xx0/rtss
      target-set:
        - set: J-Link_Debug
          images:
            - project-context: LPI2C.Debug
          debugger:
            name: J-Link Server
            port: 3333
            protocol: swd
            clock: 4000000
        - set: ULINKplus_ETR-Trace
          images:
            - project-context: LPI2C.Debug
          debugger:
            name: ULINKplus@pyOCD
            protocol: swd
            clock: 10000000
            device-settings:
              FUNNEL_0_INPUT_MASK: 0x6
              ETR_0_BUFFER_ADDRESS: 0x58000000
              ETR_0_BUFFER_ADDRESS_HI: 0x00000000
              ETR_0_AXI_CTL: 0x00000000
              ETR_0_BUFFER_SIZE: 0x00004000 # 16*4 = 64 KBytes
              #ETR_0_BUFFER_SIZE: 0x00040000 # 256*4 = 1024 KBytes
              #ETR_0_BUFFER_SIZE: 0x00020000 # 128*4 = 512 KBytes
              #ETR_0_BUFFER_SIZE: 0x00010000 # 64*4 = 256 KBytes
              #ETR_0_BUFFER_SIZE: 0x00008000 # 32*4 = 128 KBytes
              #ETR_0_BUFFER_SIZE: 0x00004000 # 16*4 = 64 KBytes
              #ETR_0_BUFFER_SIZE: 0x00002000 # 8*4 KBytes
            trace:
              - trace-buffer:
                mode: file

  build-types:
    - type: Debug
      west-defs:
        - CONFIG_DEBUG: y
        - CONFIG_DEBUG_THREAD_INFO: y
        - CONFIG_THREAD_STACK_INFO: y
        - CONFIG_DEBUG_OPTIMIZATIONS: y
    - type: Release
      west-defs:
        - CONFIG_SIZE_OPTIMIZATIONS: y

  # List related projects.
  projects:
    - west:
        project-id: LPI2C
        app-path: ./lpi2c
        board: $west-board$_he
        device: :M55_HE
        west-defs:
          - CONFIG_NEWLIB_LIBC: y
          - CONFIG_NEWLIB_LIBC_NANO: n

  compiler: GCC
